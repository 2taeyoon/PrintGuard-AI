# 클로드 봇 — 이슈에 `claude` 라벨을 붙이거나, 이슈·PR에 `@claude`라고 쓰면 깨어난다.
#
# 러너(깃헙이 빌려 주는 임시 리눅스)에서 클로드 코드가 돌며 가지를 치고 고친 뒤 PR을 연다.
# 내 컴퓨터는 꺼 둬도 된다.
#
# **이 저장소는 공개다.** 그래서 두 겹으로 잠근다.
#   1. 부르는 사람이 저장소 주인일 때만 돈다(아래 `if`).
#   2. 같은 저장소의 PR만 본다. 남의 포크에서 온 PR은 아예 건드리지 않는다.
# 포크 PR에는 깃헙이 비밀값을 주지 않지만, 거기 기대지 않고 한 번 더 막는다.
name: 클로드

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # 한 이슈·PR에 두 번 불러도 겹쳐 돌지 않는다. 같은 가지에 두 클로드가 푸시하면 서로를 덮는다.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # 주인이 부를 때만. 라벨은 `claude`, 코멘트는 `@claude`가 들어 있을 때.
    if: >-
      github.event.sender.login == github.repository_owner &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'claude') ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write         # 가지를 치고 푸시한다
      pull-requests: write    # PR을 열고 코멘트를 단다
      issues: write
      id-token: write
      actions: read           # 실패한 CI 로그를 읽는다
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 가지를 따고 main과 견주려면 역사가 필요하다

      - name: 클로드에게 맡긴다
        uses: anthropics/claude-code-action@v1
        with:
          # **구독(Max) 토큰만 쓴다.** API 열쇠는 쓰지 않는다 — 쓴 만큼 돈이 나가기 때문이다.
          # 값은 터미널에서 `claude setup-token`으로 받아 비밀값 CLAUDE_CODE_OAUTH_TOKEN에 넣는다.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 주인이 부른 실행 안에서 CodeRabbit·CI가 남긴 글도 읽게 한다. 봇이 남긴 글만으로
          # 이 봇이 깨어나지는 않는다(위 `if`가 막는다) — 그 일은 coderabbit-fix.yml이 맡는다.
          allowed_bots: "coderabbitai,github-actions"
          branch_prefix: "claude/"
          # **prompt를 두지 않는다.** prompt가 있으면 액션이 '자동 작업' 모드로 돌아, 사람이 단
          # @claude 댓글을 읽지 않고 PR에 답글도 달지 않는다(첫 시험에서 그렇게 1턴 만에 조용히
          # 끝났다). 빼 두면 '대화' 모드가 되어 댓글을 읽고 claude[bot]으로 답하고 커밋한다.
          # 지킬 규칙은 저장소 뿌리의 CLAUDE.md에 있고, 봇이 스스로 읽는다.
          claude_args: >-
            --max-turns 50
            --model claude-sonnet-5-5
