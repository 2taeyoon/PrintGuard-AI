# PR마다 도는 검사. 클로드가 연 PR이 **실제로 도는지**를 보는 자리다.
# 비밀값을 하나도 쓰지 않으므로 누가 연 PR이든 안전하게 돈다.
name: 검사

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: 꾸러미 받기
        run: pip install -r agents/requirements.txt
      - name: 시험
        working-directory: agents
        # 시험은 `conftest.py`에서 `PG_DATA_DIR`을 임시 폴더로 돌리고 열쇠를 지운다.
        # 그래서 러너에 .env가 없어도 그대로 돈다(진짜 API를 부르지 않는다).
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          # transformers.js가 데려오는 onnxruntime-node는 설치 때마다 NuGet에서 실행 파일을
          # 내려받는다. 그 내려받기가 가끔 실패해 검사가 깨졌다(2026-11-16, PR #98). 여기서는
          # 타입·린트만 보고 이 파일을 쓰지 않으므로 아예 받지 않는다. 브라우저는 onnxruntime-web을 쓴다.
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: 타입
        # `LayoutProps` 같은 타입은 Next가 만들어 준다. 빌드 없이 tsc만 돌리면 그 타입이
        # 없어서 깨진다 — 그래서 먼저 타입을 뽑는다(전체 빌드보다 훨씬 빠르다).
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: 린트
        run: npm run lint
