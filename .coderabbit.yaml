# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit — PR에 올라오는 코드를 읽고 한국어로 짚어 준다.
#
# 이 저장소의 글은 전부 한국어다(커밋 메시지·PR 본문·주석·화면 문구). 검수 의견만 영어로
# 오면 읽는 사람이 둘로 갈라지므로 `language`를 ko-KR로 둔다.
#
# 손대는 원칙 하나: **시끄러우면 끈다.** 열 줄 중 아홉이 넘길 말이면 나머지 한 줄도 안 읽힌다.
# 그래서 설정이 없는 린터(ruff)와 한국어 글에 약한 검사(markdownlint·languagetool)는 꺼 둔다.
language: ko-KR

tone_instructions: >-
  쉬운 한국어로, 번역투 없이. 무엇이 어떻게 잘못되는지 한 줄로 먼저 말하고 근거를 뒤에 붙인다.
  취향 지적은 하지 않는다 — 인쇄·파일·돈이 걸린 자리만 짚는다.

reviews:
  profile: chill                 # assertive는 혼자 쓰는 저장소에서 금세 소음이 된다
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: true        # 에이전트 아홉이 주고받는 흐름은 그림이 빠르다
  assess_linked_issues: true
  poem: false                    # 시는 읽을 거리가 아니다
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main                     # dev → main PR 하나가 이 저장소의 길이다
    auto_incremental_review: true

  # 사람이 읽을 코드만 본다. 아래는 만들어지거나 받아 온 것이라 검수가 뜻이 없다.
  path_filters:
    - "!samples/**"                             # 시험용 PDF 60MB
    - "!eval/**/*.csv"                          # 행정안전부 인쇄사 원자료
    - "!eval/photo_color_js.json"               # 색 측정 결과(기계가 쓴 것)
    - "!frontend/public/data/shops.json"        # 인쇄소 17,082곳
    - "!frontend/public/data/papers.json"       # 종이 489종
    - "!frontend/public/pdf.worker.min.mjs"     # 가져다 쓰는 번들
    - "!**/*.woff2"
    - "!**/*.idml"
    - "!**/*.pdf"
    - "!**/.next/**"
    - "!agents/.data/**"                        # 올린 파일과 작업 폴더

  path_instructions:
    - path: "frontend/app/**/*.tsx"
      instructions: |
        화면 코드다. 이 저장소에서 실제로 났던 사고를 중심으로 본다.

        - **JSX는 태그에 붙은 줄바꿈을 지운다.** 줄 끝이 한글이고 다음 줄이 `<b>`·`<code>`·
          `<Link>`로 시작하면 화면에서 두 낱말이 들러붙는다(`싶으면PG_LLM_EFFORT`). 그런 자리에는
          `{" "}`가 있어야 한다. 한 줄 안에서 `전체는<a>`처럼 바로 붙여 쓴 것도 같다.
        - 효과(useEffect) 안에서 setState를 바로 부르지 않는다. 초기화가 필요하면 `key`를 바꿔
          다시 그리게 한다.
        - 파랑은 `--thema`(#0071E3) 하나다. 선·테두리·강조 글씨·호버에 다른 파랑(#2997ff 같은)을
          쓰지 않는다. 옅은 파랑(--themaLight·--themaPoint)은 **면(배경)에만**.
        - 칩·알약·뱃지는 모서리를 둥글리지 않는다(`border-radius: 0`).
        - 사용자에게 보이는 글은 한국어다. 영어는 고유명사·코드(IDML, FOGRA51, Document Fonts)뿐.
        - Next.js 버전이 학습 데이터와 다르다. Next API를 쓰는 변경이면 `frontend/AGENTS.md`가
          가리키는 `node_modules/next/dist/docs/`를 읽었는지 묻는다.

    - path: "agents/pg_agents/**/*.py"
      instructions: |
        에이전트 코드다. 사람의 파일을 건드리고 돈이 드는 쪽이라 더 깐깐히 본다.

        - **파일을 쓰는 skill은 safety 관문을 거친다.** 관문에 닿지 못하면 거절한다(fail-closed).
          카드(`CARD`)의 grade와 `allowed_requesters`가 실제 동작과 맞는지 본다.
        - 올린 원본은 고치지 않는다. 고친 것은 **사본**으로 내준다.
        - 되돌릴 수 없는 일(원본 수정·지우기)은 **먼저 묻는다**.
        - DesignCraft 엔진 명령은 차례가 있다: `frame.create` → `type.char` → `text.insert`.
          글을 먼저 넣으면 글꼴이 안 먹어 PDF에 한 자도 안 찍힌다.
        - 인쇄 색은 CMYK다. `{c,m,y,k}` 대신 `#rrggbb`를 쓰면 preflight에 RGB로 걸린다.
        - 사람에게 보이는 문구는 한국어로. 엔진이 영어로 준 말은 `designcraft/issue_text.py`의
          규칙표를 거친다.
        - 주석은 **왜 그렇게 했는지**를 적는다. 무엇을 하는지는 코드가 이미 말한다.

    - path: "agents/tests/**/*.py"
      instructions: |
        시험은 **무엇이 잘못됐었는지**를 적어 두는 자리다. 이름과 docstring이 그 사고를 말하는지
        본다("test_a_page_the_document_does_not_have_is_skipped"처럼). 수치를 바꾸는 변경이라면
        그 수치를 지키는 시험이 같이 왔는지 묻는다.

    - path: "**/*.md"
      instructions: |
        한국어 문서다. 번역투(에 대한·을 통해·되어집니다)와 명사 나열을 짚는다. 수치가 적혀
        있으면 코드의 값과 같은지 본다 — 문서만 남고 코드가 바뀐 자리가 가장 자주 틀린다.

  tools:
    # 저장소에 설정이 없는 린터는 기본 규칙으로 돌아 수백 줄을 쏟아 낸다. 설정을 들일 때까지 끈다.
    ruff:
      enabled: false
    markdownlint:
      enabled: false             # 한국어 문서는 줄이 길다(MD013)
    languagetool:
      enabled: false             # 한국어 글에는 거의 도움이 안 되고 영문 낱말만 집는다
    eslint:
      enabled: true
      config_file: frontend/eslint.config.mjs
    shellcheck:
      enabled: true              # build.sh·run 스크립트
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true              # .env는 추적하지 않지만, 열쇠가 섞여 들어오는 것은 막는다

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local                 # 이 저장소에서 배운 것만 쓴다
  issues:
    scope: local
