# CodeRabbit — 쓰지 않는다. PR 리뷰는 클로드가 한다(.github/workflows/claude-review.yml).
#
# CodeRabbit이 읽고 클로드가 고치는 두 봇 구조는 서로를 기다려 느렸다(22개 파일 PR에서
# CodeRabbit 리뷰만 14분). 이제 클로드 한 실행 안에서 읽기 → 고치기 → 머지가 끝난다.
#
# 이 파일은 **CodeRabbit 앱이 아직 저장소에 붙어 있는 동안** 자동 리뷰를 끄려고 남겨 둔다.
# 설정 파일이 없으면 앱은 기본값(영어, 자동 리뷰 켜짐)으로 돈다. 저장소 주인이 GitHub 설정에서
# CodeRabbit 앱을 빼면 이 파일도 지운다.
language: ko-KR
reviews:
  auto_review:
    enabled: false
  request_changes_workflow: false
chat:
  auto_reply: false
